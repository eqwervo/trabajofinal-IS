version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: icestats
      POSTGRES_PASSWORD: icestats
      POSTGRES_DB: icestats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://icestats:icestats@db:5432/icestats

volumes:
  postgres_data:
